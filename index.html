<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Silent Disco</title>

    <style>

        #danceFloor {
            width: 500px;
            height: 300px;
            background-color: lightgray;
        }

        .panel  {
            width: 150px;
            height: 100px;
            background-color: black;
            display: inline-block;
            margin: 10px;
        }

        #dancer {
            font-size: 60px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1> Silent Disco 🎧</h1>
<div id="danceFloor">

    <div id="panel1" class="panel"></div>
    <div id="panel2" class="panel"></div>

    <br>

    <span id="dancer">🕺</span>

</div>
</body>
</html>
