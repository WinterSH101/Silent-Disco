<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Silent Disco</title>

    <style>

        #danceFloor {
            width: 500px;
            height: 300px;
            background-color: lightgray;
        }

        .panel  {
            width: 150px;
            height: 100px;
            background-color: black;
            display: inline-block;
            margin: 10px;
        }

        #dancer {
            font-size: 60px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1> Silent Disco 🎧</h1>
<div id="danceFloor">

    <div id="panel1" class="panel"></div>
    <div id="panel2" class="panel"></div>

    <br>

    <span id="dancer">🕺</span>

</div>
<script>

    const panel1 = document.getElementById("panel1");
    const panel2 = document.getElementById("panel2");

    function randomColor() {
        let red = Math.floor(Math.random() * 255);
        let green = Math.floor(Math.random() * 255);
        let blue = Math.floor(Math.random() * 255);

        return "rgb(" + red + "," + green + "," + blue + ")";
    }
    let panelTimer = setInterval(function () {

        panel1.style.backgroundColor = randomColor();
        panel2.style.backgroundColor = randomColor();

    }, 1500);
    // Phase 2
    const danceFloor = document.getElementById("danceFloor");
    const dancer = document.getElementById("dancer");

    danceFloor.addEventListener("click", function (){
        danceFloor.style.backgroundColor = randomColor();
    });

    dancer.addEventListener("click", function (event){
        event.stopPropagation();
        dancer.textContent = "💃"
    });

</script>
</body>
</html>
